name: Q1
run-name: ${{ github.actor }} archive XYZ.txt
on: [push]
permissions:
  contents: write
jobs:
  Archivage-XYZ:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Copie de XYZ.txt
        run: cat XYZ.txt > Q1_archive_XYZ.txt

      - name: Commit et push
        run: |
          git config --global user.name julesbqt
          git config --global user.email jules.bouquet@etu.univ-lehavre.fr
          git add Q1_archive_XYZ.txt
          git commit -m "Archivage de XYZ.txt dans Q1_archive_XYZ.txt"
          git push
