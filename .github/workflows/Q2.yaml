name: Q2
run-name: ${{ github.actor }} cree Q2_archive_XYZ.txt
on: [push]
permissions:
  contents: write
jobs:
  Archivage-XYZ-Q2:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Création de Q2_archive_XYZ.txt
        run: |
          echo "Jules Bouquet" > Q2_archive_XYZ.txt
          echo "executé le : $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M:%S')" >> Q2_archive_XYZ.txt
          echo "Contenu de XYZ.txt : " >> Q2_archive_XYZ.txt
          cat XYZ.txt >> Q2_archive_XYZ.txt
          echo "" >> Q2_archive_XYZ.txt
          echo "Taille XYZ.txt : $(wc -c < XYZ.txt) octets" >> Q2_archive_XYZ.txt
      # push
      - name: Commit et push
        run: |
          git config --global user.name julesbqt
          git config --global user.email jules.bouquet@etu.univ-lehavre.fr
          git add Q2_archive_XYZ.txt
          git commit -m "Création de Q2_archive_XYZ.txt"
          git pull --rebase
          git push
