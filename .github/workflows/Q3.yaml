name: Q3
run-name: ${{ github.actor }} crée Q3_archive_java.txt
on: [push]
permissions:
  contents: write
jobs:
  Archivage-Java-Q3:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Création de Q3_archive_java.txt
        run: |
          echo "Jules Bouquet" > Q3_archive_java.txt
          echo "Contenu de Q3.java:" >> Q3_archive_java.txt
          cat Q3.java >> Q3_archive_java.txt
      # push
      - name: Commit et push
        run: |
          git config --global user.name julesbqt
          git config --global user.email jules.bouquet@etu.univ-lehavre.fr
          git add Q3_archive_java.txt
          git commit -m "Création de Q3_archive_java.txt"
          git pull --rebase
          git push
