name: Q4
run-name: ${{ github.actor }} crée Q4_archive_date.txt 🚀
on: [push]
permissions:
  contents: write
jobs:
  Archivage-Java-Q4:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Création de Q4_archive_date.txt
        run: |
          FICHIER="Q4_archive_$(TZ=Europe/Paris date +%d-%m-%Y).txt"
          echo "Jules Bouquet" > $FICHIER
          echo "Contenu de Q4.java:" >> $FICHIER
          cat Q4.java >> $FICHIER
      # push
      - name: Commit et push
        run: |
          git config --global user.name julesbqt
          git config --global user.email jules.bouquet@etu.univ-lehavre.fr
          git add Q4_archive_*.txt
          git commit -m "Création de Q4_archive_date.txt"
          git pull --rebase
          git push
